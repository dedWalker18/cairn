[workspace]
resolver = "2"
members = ["crates/cairn-core", "crates/cairn-ml", "crates/cairnd", "crates/cairn", "crates/cairn-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
jiff = "0.2"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1"
sha2 = "0.10"
landlock = "0.4"
inotify = { version = "0.11", default-features = false }
crossbeam-channel = "0.5"
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "bmp", "tiff"] }
jpeg-decoder = { version = "0.3", default-features = false }
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }
gtk4 = "0.11"
cairn-core = { path = "crates/cairn-core" }
cairn-ml = { path = "crates/cairn-ml" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
overflow-checks = true
debug = "line-tables-only"

# candle is unusably slow unoptimized; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
